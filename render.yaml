services:
  - type: web
    name: ipk-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run start -w @ipk/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
